# 每次推送和拉取请求都用 SwiftPM 构建并跑单元测试。
# 正式的 .app（带小组件扩展和快捷指令元数据）要本机证书签名，用 scripts/build-app.sh 打包，不在这里做。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 可以手动重跑：失败修好之后想只重跑一次，或者想验证某个分支而不发 PR。
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: 用最新的 Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          swift --version
      - name: 构建
        run: swift build
      - name: 单元测试
        run: swift test
